services:
  app:
    build:
      context: .
    container_name: fudo-challenge-api
    ports:
      - "${PORT}:9292"
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      EXTERNAL_PRODUCTS_URL: ${EXTERNAL_PRODUCTS_URL}
      HOST: ${HOST}
      PORT: ${PORT}
      RACK_ENV: ${RACK_ENV:-development}
      ERROR_BACKTRACE_LINES: ${ERROR_BACKTRACE_LINES:-10}
    networks:
      - fudo_network

networks:
  fudo_network:
    driver: bridge
