version: '3.9'

services:
  app:
    build:
      context: .
    container_name: fudo-challenge-api
    ports:
      - "${PORT}:9292"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BCRYPT_COST: ${BCRYPT_COST}
      ASYNC: ${ASYNC}
      EXTERNAL_PRODUCTS_URL: ${EXTERNAL_PRODUCTS_URL}
      HOST: ${HOST}
      PORT: ${PORT}
    networks:
      - fudo_network

networks:
  fudo_network:
    driver: bridge
